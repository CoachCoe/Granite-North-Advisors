# Security and cache headers for the hosted site. Amplify reads this file from
# the repo root on every deploy. (Headers inside amplify.yml are deprecated and
# are not applied.) This is the source of truth for response headers.
#
# If you add analytics or anything else that loads from another origin, update
# the Content-Security-Policy here to allow it.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
      - key: Cross-Origin-Opener-Policy
        value: same-origin
  - pattern: '/_astro/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
