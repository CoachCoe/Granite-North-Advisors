version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Match the Node version pinned in .node-version (Astro 7 needs Node 24).
        - nvm install 24
        - nvm use 24
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
# Amplify ignores public/_headers (Cloudflare format), so the security and cache
# headers are declared here instead. Keep this in sync with public/_headers.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
      - key: Cross-Origin-Opener-Policy
        value: same-origin
  - pattern: '/_astro/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
