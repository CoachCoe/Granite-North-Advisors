version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Match the Node version pinned in .node-version (Astro 7 needs Node 24).
        - nvm install 24
        - nvm use 24
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
# Response headers (CSP, HSTS, caching) live in customHttp.yml, not here.
